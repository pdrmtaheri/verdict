7c91d875:
  law: Only src/agents/ and src/models.ts talk to a coding agent or a model
    provider; everything else goes through runAgent() or decisionModel().
  enforcers:
    - test: .verdict/provider-boundary.test.ts
ba64ed02:
  law: An agent's file tools never read or write outside the repository, and the
    planner never writes outside .verdict/.
  enforcers:
    - test: .verdict/agent-read-boundary.test.ts
    - test: .verdict/planner-write-boundary.test.ts
    - llm: .verdict/agent-builtin-tools.judge.md
408cc85a:
  law: "`verdict check` exits 0 only when no law fails and every law is planned."
  enforcers:
    - test: .verdict/check-exit-code.test.ts
a3b28a29:
  law: Error messages tell the user what to do next.
  enforcers:
    - llm: .verdict/error-messages-next-step.judge.md
f25eb789:
  law: "Once the planner's submission is accepted, nothing the agent does
    afterwards changes the plan: no later or concurrent submit is validated or
    accepted, and runAgent returns the first submission it accepted."
  enforcers:
    - test: .verdict/submit-first-wins.test.ts
21becdf0:
  law: However `verdict plan` is interrupted, and in whatever order laws are
    added, reworded or removed, VERDICT.lock only holds entries for laws
    currently in VERDICT.md, and running plan to completion afterwards leaves
    every law planned.
  enforcers:
    - test: .verdict/plan-interrupt-lock.test.ts
3d2d5b60:
  law: The egress proxy never opens a connection to a host or port outside its
    allowlist, however the request is split across packets, cased or padded.
  enforcers:
    - test: .verdict/egress-allowlist.test.ts
10a12de4:
  law: "`verdict check` never changes the repository: after it runs, git status
    and the contents of every file are what they were before."
  enforcers:
    - test: .verdict/check-read-only.test.ts
23a2e318:
  law: "`verdict plan` on a repo whose laws are all in sync, with every break
    still caught, finishes without starting a coding agent."
  enforcers:
    - test: .verdict/plan-in-sync-no-agent.test.ts
44811e1b:
  law: Re-wrapping or re-indenting a law in VERDICT.md never makes `verdict check`
    report it as not planned; changing any of its words does.
  enforcers:
    - test: .verdict/rewrap-hash.test.ts
