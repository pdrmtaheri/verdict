f25eb789:
  law: "Once the planner's submission is accepted, nothing the agent does
    afterwards changes the plan: no later or concurrent submit is validated or
    accepted, and runAgent returns the first submission it accepted."
  enforcers:
    - test: .verdict/submit-first-wins.test.ts
      inputs:
        .verdict/submit-first-wins.test.ts: 20821a8178ed
        bunfig.toml: a7cb2619e020
    - test: .verdict/submit-schedules.test.ts
      inputs:
        .verdict/submit-schedules.test.ts: 9037b871fd4a
        bunfig.toml: a7cb2619e020
    - test: .verdict/submit-agent-throws.test.ts
      inputs:
        .verdict/submit-agent-throws.test.ts: 95d95a55f018
        bunfig.toml: a7cb2619e020
21becdf0:
  law: However `verdict plan` is interrupted, and in whatever order laws are
    added, reworded or removed, VERDICT.lock only holds entries for laws
    currently in VERDICT.md, and running plan to completion afterwards leaves
    every law planned.
  enforcers:
    - test: .verdict/plan-interrupt-lock.test.ts
      inputs:
        .verdict/plan-interrupt-lock.test.ts: a40a8f4c7c41
        .verdict/plan-interrupt-runner.ts: 25c2b4bfdda2
        bunfig.toml: a7cb2619e020
3d2d5b60:
  law: The egress proxy never opens a connection to a host or port outside its
    allowlist, however the request is split across packets, cased or padded.
  enforcers:
    - test: .verdict/egress-allowlist.test.ts
      inputs:
        .verdict/egress-allowlist.test.ts: b471bb508543
        bunfig.toml: a7cb2619e020
10a12de4:
  law: "`verdict check` never changes the repository: after it runs, git status
    and the contents of every file are what they were before."
  enforcers:
    - test: .verdict/check-read-only.test.ts
      inputs:
        .verdict/check-read-only.test.ts: ba9cc54c4048
        bunfig.toml: a7cb2619e020
23a2e318:
  law: "`verdict plan` on a repo whose laws are all in sync, with every break
    still caught, finishes without starting a coding agent."
