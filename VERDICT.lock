255a2f49:
  law: Within src/, only src/agents/ and src/models.ts talk to a coding agent or a
    model provider; the rest of src/ goes through runAgent() or decisionModel().
  enforcers:
    - test: .verdict/src-provider-boundary.test.ts
      scope: every .ts/.tsx/.js/.jsx/.mjs/.cjs/.mts/.cts file under src/ (symlinks
        skipped) except src/agents/** and src/models.ts; static text scan for
        agent/provider packages, ai SDK use, adapter imports, agent CLIs by
        literal name, provider hosts, reads of provider key/base-URL env values
        (bare presence tests exempt), network calls; tests and .verdict/ not
        covered
      inputs:
        .verdict/src-provider-boundary.test.ts: 40c57e6f6bd9
        bunfig.toml: a7cb2619e020
539d28d7:
