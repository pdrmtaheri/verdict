<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Four-way traffic light</title>
<style>
  :root {
    --ink: #111114;
    --muted: #5B5B66;
    --line: #E7E7EA;
    --ground: #EEEEF1;
    --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; color: var(--ink); font-family: var(--sans); font-size: 12px; line-height: 16px; -webkit-font-smoothing: antialiased; }
  /* The playground already labels this frame, so the page is only the controls and the crossroads, sized to fit the frame. */
  .preview { max-width: min(680px, max(320px, (100vh - 72px) * 584 / 340 + 32px)); margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  /* Nothing in the bar changes size with the text: the readout is two lines in a column as wide as its longest
     state, and only the slider's track gives way in a narrow frame. So the crossroads never jumps. */
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .speed { display: flex; align-items: center; gap: 8px; flex: 0 1 auto; min-width: 0; color: var(--muted); font-weight: 500; }
  .speed input { flex: 1 1 128px; width: 128px; min-width: 48px; margin: 0; accent-color: var(--ink); cursor: pointer; }
  .speed input:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }
  .speed output { min-width: 4ch; text-align: right; color: var(--ink); font: 600 12px/16px var(--mono); }
  .surface { position: relative; background: var(--ground); border-radius: 8px; overflow: hidden; aspect-ratio: 584 / 340; }
  .surface svg { display: block; width: 100%; height: 100%; }
  .readout { display: flex; flex-direction: column; flex: 0 0 21ch; font-family: var(--mono); font-weight: 500; }
  .readout .state { color: var(--muted); font-weight: 400; }
  .readout span { white-space: nowrap; }
</style>
</head>
<body>
<main class="preview">
  <div class="bar">
    <div class="readout" aria-live="off">
      <span id="clock">t = 0.0s</span>
      <span class="state" id="state"></span>
    </div>
    <label class="speed">
      Speed
      <!-- 0..1000 maps to 1x..60x on a log scale, so slow speeds get as much of the track as fast ones; 562 is 10x. -->
      <input id="speed" type="range" min="0" max="1000" value="562">
      <output id="speed-value" for="speed">10×</output>
    </label>
  </div>
  <div class="surface">
    <svg id="scene" viewBox="0 0 584 340" role="img" aria-label="Crossroads with traffic lights"></svg>
  </div>
</main>
<script src="controller.js"></script>
<script src="app.js"></script>
</body>
</html>
