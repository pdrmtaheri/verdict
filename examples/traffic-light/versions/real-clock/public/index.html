<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Four-way traffic light</title>
<style>
  :root {
    --ink: #111114;
    --muted: #5B5B66;
    --line: #E7E7EA;
    --ground: #EEEEF1;
    --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; color: var(--ink); font-family: var(--sans); font-size: 12px; line-height: 16px; -webkit-font-smoothing: antialiased; }
  .preview { max-width: 680px; margin: 0 auto; padding: 48px 48px 32px; display: flex; flex-direction: column; gap: 16px; }
  .bar { display: flex; align-items: center; justify-content: space-between; height: 28px; gap: 12px; }
  .title { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
  .label { color: var(--muted); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
  .path { color: var(--muted); font-family: var(--mono); }
  .speeds { display: flex; border: 1px solid var(--line); border-radius: 6px; height: 28px; flex-shrink: 0; }
  .speeds button { width: 44px; height: 28px; border: 0; border-radius: 5px; background: transparent; color: var(--muted); font: 500 12px/16px var(--mono); cursor: pointer; padding: 0; }
  .speeds button[aria-pressed="true"] { background: var(--ink); color: #fff; font-weight: 600; }
  .speeds button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .surface { position: relative; background: var(--ground); border-radius: 8px; overflow: hidden; aspect-ratio: 584 / 340; }
  .surface svg { display: block; width: 100%; height: 100%; }
  .readout { position: absolute; left: 16px; bottom: 14px; display: flex; gap: 10px; font-family: var(--mono); font-weight: 500; }
  .readout .state { color: var(--muted); font-weight: 400; }
</style>
</head>
<body>
<main class="preview">
  <div class="bar">
    <div class="title">
      <span class="label">Preview</span>
      <span class="path">public/index.html</span>
    </div>
    <div class="speeds" role="group" aria-label="Clock speed">
      <button type="button" data-speed="1" aria-pressed="false">1×</button>
      <button type="button" data-speed="10" aria-pressed="true">10×</button>
      <button type="button" data-speed="60" aria-pressed="false">60×</button>
    </div>
  </div>
  <div class="surface">
    <svg id="scene" viewBox="0 0 584 340" role="img" aria-label="Crossroads with traffic lights"></svg>
    <div class="readout" aria-live="off">
      <span id="clock">t = 0.0s</span>
      <span class="state" id="state"></span>
    </div>
  </div>
</main>
<script src="controller.js"></script>
<script src="app.js"></script>
</body>
</html>
