# scope: all .ts/.js files under src/; syntactic detection of eval, Function constructor (direct, new, globalThis/window/global access, .constructor("...") on functions), and string-argument setTimeout/setInterval. Does not cover vm module or aliasing through variables.
rules:
  - id: no-dynamic-code-execution
    languages: [typescript, javascript]
    severity: ERROR
    message: Never run a string as JavaScript (eval / Function constructor).
    paths:
      include:
        - src/
      exclude:
        - .verdict/
    pattern-either:
      - pattern: eval(...)
      - pattern: Function(...)
      - pattern: new Function(...)
      - pattern: globalThis.eval(...)
      - pattern: globalThis.Function(...)
      - pattern: global.eval(...)
      - pattern: global.Function(...)
      - pattern: window.eval(...)
      - pattern: window.Function(...)
      - pattern: globalThis["eval"]
      - pattern: globalThis["Function"]
      - pattern: (() => {}).constructor(...)
      - pattern: (function () {}).constructor(...)
      - pattern: setTimeout("...", ...)
      - pattern: setInterval("...", ...)
      - pattern: new (Function)(...)
      - pattern: Reflect.construct(Function, ...)
      - pattern: Reflect.apply(eval, ...)
